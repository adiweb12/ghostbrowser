name: Ghost Browser Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle 8.5
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.5

    - name: Initialize Folders
      run: |
        mkdir -p app/src/main/java/com/example/ghostbrowser
        mkdir -p app/src/main/res/values

    - name: Create Global Configs
      run: |
        # Fix for the AndroidX error
        cat <<EOF > gradle.properties
        android.useAndroidX=true
        android.enableJetifier=true
        org.gradle.jvmargs=-Xmx2048m
        EOF

        # Standard settings
        echo "include ':app'" > settings.gradle

    - name: Generate AndroidManifest & Resources
      run: |
        cat <<EOF > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
            <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
            <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="32" />

            <application
                android:allowBackup="false"
                android:hardwareAccelerated="true" 
                android:icon="@android:drawable/ic_menu_search"
                android:label="Ghost Browser"
                android:theme="@style/Theme.Material3.DayNight.NoActionBar">
                
                <activity
                    android:name=".MainActivity"
                    android:exported="true"
                    android:windowSoftInputMode="adjustResize">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>

                <service
                    android:name=".GhostVpnService"
                    android:permission="android.permission.BIND_VPN_SERVICE"
                    android:exported="false">
                    <intent-filter>
                        <action android:name="android.net.VpnService" />
                    </intent-filter>
                </service>

                <service android:name=".GhostBrowserService" android:exported="false" />
            </application>
        </manifest>
        EOF

        cat <<EOF > app/src/main/res/values/themes.xml
        <?xml version="1.0" encoding="utf-8"?>
        <resources>
            <style name="Theme.Material3.DayNight.NoActionBar" parent="android:Theme.DeviceDefault.NoActionBar" />
        </resources>
        EOF

    - name: Move Manual Kotlin Files
      run: |
        # Organize your manually added root files into the project structure
        find . -maxdepth 1 -name "*.kt" -exec mv {} app/src/main/java/com/example/ghostbrowser/ \;
        echo "Kotlin files organized."

    - name: Setup Build Scripts
      run: |
        cat <<EOF > build.gradle
        buildscript {
            repositories { google(); mavenCentral() }
            dependencies { 
                classpath 'com.android.tools.build:gradle:8.2.2'
                classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.0"
            }
        }
        allprojects { repositories { google(); mavenCentral() } }
        EOF

        cat <<EOF > app/build.gradle
        plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
        android {
            namespace 'com.example.ghostbrowser'
            compileSdk 34
            defaultConfig {
                applicationId "com.example.ghostbrowser"
                minSdk 25
                targetSdk 34
                versionCode 1
                versionName "2.5-VPN-PRO"
            }
            buildFeatures { compose true }
            composeOptions { kotlinCompilerExtensionVersion '1.5.1' }
            compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
            kotlinOptions { jvmTarget = '17' }
        }
        dependencies {
            implementation 'androidx.core:core-ktx:1.12.0'
            implementation 'androidx.activity:activity-compose:1.8.2'
            implementation platform('androidx.compose:compose-bom:2023.08.00')
            implementation 'androidx.compose.ui:ui'
            implementation 'androidx.compose.ui:ui-graphics'
            implementation 'androidx.compose.material3:material3'
            implementation 'androidx.compose.material:material-icons-extended'
            implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.1'
        }
        EOF

    - name: Build APK
      run: gradle assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: GhostBrowser-Build
        path: app/build/outputs/apk/debug/app-debug.apk
