name: Ghost Browser Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle 8.5
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.5

    - name: Initialize Project Structure & Files
      run: |
        # 1. Clean and Create Folders
        rm -rf app
        mkdir -p app/src/main/java/com/example/ghostbrowser
        mkdir -p app/src/main/res/values

        # 2. Create gradle.properties (FIXES THE ANDROIDX ERROR)
        cat <<EOF > gradle.properties
        android.useAndroidX=true
        android.enableJetifier=true
        org.gradle.jvmargs=-Xmx2048m
        EOF

        # 3. Create the Android Manifest
        cat <<EOF > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android"
            package="com.example.ghostbrowser">

            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />

            <application
                android:allowBackup="true"
                android:icon="@android:drawable/ic_menu_browser"
                android:label="Ghost Browser"
                android:theme="@style/Theme.Material3.DayNight.NoActionBar">
                
                <activity
                    android:name=".MainActivity"
                    android:exported="true"
                    android:configChanges="orientation|screenSize">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>

                <service
                    android:name=".GhostBrowserService"
                    android:enabled="true"
                    android:exported="false"
                    android:foregroundServiceType="specialUse" />
            </application>
        </manifest>
        EOF

        # 4. Create Material3 resources
        cat <<EOF > app/src/main/res/values/colors.xml
        <?xml version="1.0" encoding="utf-8"?>
        <resources>
            <color name="purple_500">#FF6200EE</color>
        </resources>
        EOF

        cat <<EOF > app/src/main/res/values/themes.xml
        <?xml version="1.0" encoding="utf-8"?>
        <resources>
            <style name="Theme.Material3.DayNight.NoActionBar" parent="android:Theme.DeviceDefault.NoActionBar" />
        </resources>
        EOF

    - name: Move and Arrange Kotlin Files
      run: |
        # Move Kotlin files from the main repo folder into the app package
        if [ -f "MainActivity.kt" ]; then
          mv MainActivity.kt app/src/main/java/com/example/ghostbrowser/
          echo "Arranged MainActivity.kt"
        fi
        if [ -f "GhostBrowserService.kt" ]; then
          mv GhostBrowserService.kt app/src/main/java/com/example/ghostbrowser/
          echo "Arranged GhostBrowserService.kt"
        fi

    - name: Generate Build Scripts
      run: |
        # Root settings.gradle
        echo "include ':app'" > settings.gradle

        # Root build.gradle
        cat <<EOF > build.gradle
        buildscript {
            repositories { google(); mavenCentral() }
            dependencies { 
                classpath 'com.android.tools.build:gradle:8.2.2'
                classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.0"
            }
        }
        allprojects { repositories { google(); mavenCentral() } }
        EOF

        # App level build.gradle
        cat <<EOF > app/build.gradle
        plugins {
            id 'com.android.application'
            id 'org.jetbrains.kotlin.android'
        }
        android {
            namespace 'com.example.ghostbrowser'
            compileSdk 34
            defaultConfig {
                applicationId "com.example.ghostbrowser"
                minSdk 26
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }
            buildFeatures { compose true }
            composeOptions { kotlinCompilerExtensionVersion '1.5.1' }
            compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
            kotlinOptions { jvmTarget = '17' }
        }
        dependencies {
            implementation 'androidx.core:core-ktx:1.12.0'
            implementation 'androidx.activity:activity-compose:1.8.2'
            implementation platform('androidx.compose:compose-bom:2023.08.00')
            implementation 'androidx.compose.ui:ui'
            implementation 'androidx.compose.material3:material3'
        }
        EOF

    - name: Build APK with Gradle 8.5
      run: gradle assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: GhostBrowser-APK
        path: app/build/outputs/apk/debug/app-debug.apk
