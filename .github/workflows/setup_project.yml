name: Ghost Browser Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        # Cache is disabled here because files are generated later in the script
        cache: '' 

    - name: Generate Project Structure & Resources
      run: |
        # 1. Create Folder Hierarchy
        mkdir -p app/src/main/java/com/example/ghostbrowser
        mkdir -p app/src/main/res/values
        mkdir -p app/src/main/res/mipmap-mdpi

        # 2. Create Themes and Colors (Required for Material3)
        cat <<EOF > app/src/main/res/values/colors.xml
        <?xml version="1.0" encoding="utf-8"?>
        <resources>
            <color name="purple_500">#FF6200EE</color>
            <color name="purple_700">#FF3700B3</color>
            <color name="teal_200">#FF03DAC5</color>
        </resources>
        EOF

        cat <<EOF > app/src/main/res/values/themes.xml
        <?xml version="1.0" encoding="utf-8"?>
        <resources>
            <style name="Theme.Material3.DayNight.NoActionBar" parent="Theme.Material3.DayNight.NoActionBar">
                <item name="colorPrimary">@color/purple_500</item>
            </style>
        </resources>
        EOF

        # 3. Create the Manifest
        cat <<EOF > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android"
            package="com.example.ghostbrowser">

            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />

            <application
                android:allowBackup="true"
                android:icon="@android:drawable/ic_menu_browser"
                android:label="Ghost Browser"
                android:theme="@style/Theme.Material3.DayNight.NoActionBar">
                
                <activity
                    android:name=".MainActivity"
                    android:exported="true"
                    android:configChanges="orientation|screenSize">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>

                <service
                    android:name=".GhostBrowserService"
                    android:enabled="true"
                    android:exported="false"
                    android:foregroundServiceType="specialUse" />
            </application>
        </manifest>
        EOF

    - name: Setup Build Files
      run: |
        echo "include ':app'" > settings.gradle

        cat <<EOF > build.gradle
        buildscript {
            repositories { google(); mavenCentral() }
            dependencies { 
                classpath 'com.android.tools.build:gradle:8.2.2'
                classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.0"
            }
        }
        allprojects { repositories { google(); mavenCentral() } }
        EOF

        cat <<EOF > app/build.gradle
        plugins {
            id 'com.android.application'
            id 'org.jetbrains.kotlin.android'
        }
        android {
            namespace 'com.example.ghostbrowser'
            compileSdk 34
            defaultConfig {
                applicationId "com.example.ghostbrowser"
                minSdk 26
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }
            buildFeatures { compose true }
            composeOptions { kotlinCompilerExtensionVersion '1.5.1' }
            compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
            kotlinOptions { jvmTarget = '17' }
        }
        dependencies {
            implementation 'androidx.core:core-ktx:1.12.0'
            implementation 'androidx.activity:activity-compose:1.8.2'
            implementation platform('androidx.compose:compose-bom:2023.08.00')
            implementation 'androidx.compose.ui:ui'
            implementation 'androidx.compose.material3:material3'
            implementation 'androidx.compose.ui:ui-tooling-preview'
        }
        EOF

    - name: Build Debug APK
      run: |
        gradle wrapper
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: GhostBrowser-APK
        path: app/build/outputs/apk/debug/app-debug.apk
