name: Mobile-Friendly Android Build

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Create Android Structure
        run: |
          mkdir -p app/src/main/java/com/example/kotlinbrowser
          mkdir -p app/src/main/res/values
          # Use copy (cp) instead of move (mv) to keep your root files safe
          cp MainActivity.kt app/src/main/java/com/example/kotlinbrowser/ || true
          cp AndroidManifest.xml app/src/main/AndroidManifest.xml || true

      - name: Generate Gradle Configuration
        run: |
          # FIX: Using double quotes (") instead of single quotes (')
          echo "rootProject.name = \"GhostBrowser\"" > settings.gradle.kts
          echo "include(\":app\")" >> settings.gradle.kts

          cat <<EOF > build.gradle.kts
          plugins {
              id("com.android.application") version "8.2.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.20" apply false
          }
          EOF

          cat <<EOF > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.example.kotlinbrowser"
              compileSdk = 35
              defaultConfig {
                  applicationId = "com.example.kotlinbrowser"
                  minSdk = 24
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0"
              }
              buildFeatures { compose = true }
              composeOptions { kotlinCompilerExtensionVersion = "1.5.1" }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation("androidx.activity:activity-compose:1.9.2")
              implementation(platform("androidx.compose:compose-bom:2024.02.01"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.webkit:webkit:1.12.0")
          }
          EOF

      - name: Force Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.5

      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew clean assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GhostBrowser-APK
          path: app/build/outputs/apk/debug/app-debug.apk
