name: Ghost Browser APK Generator

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Create Project Structure and Wrapper
        run: |
          mkdir -p app/src/main/java/com/ghost/browser
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/mipmap-mdpi

          # 1. Clean Manifest
          if [ -f AndroidManifest.xml ]; then
            sed -i 's/package="com.ghost.browser"//g' AndroidManifest.xml
            mv AndroidManifest.xml app/src/main/AndroidManifest.xml
          fi

          # 2. Move Kotlin Code
          mv MainActivity.kt app/src/main/java/com/ghost/browser/MainActivity.kt || true

          # 3. Create Dummy Resources (Stops processDebugResources from failing)
          cat <<EOF > app/src/main/res/values/colors.xml
          <?xml version="1.0" encoding="utf-8"?><resources><color name="purple_500">#FF6200EE</color></resources>
          EOF
          cat <<EOF > app/src/main/res/values/themes.xml
          <?xml version="1.0" encoding="utf-8"?><resources><style name="Theme.MaterialComponents.Light.NoActionBar" parent="Theme.MaterialComponents.Light.NoActionBar" /></resources>
          EOF

          # 4. Create Build Files
          cat <<EOF > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

          cat <<EOF > settings.gradle.kts
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { 
            repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
            repositories { google(); mavenCentral() } 
          }
          rootProject.name = "GhostBrowser"
          include(":app")
          EOF

          cat <<EOF > build.gradle.kts
          plugins {
              id("com.android.application") version "8.1.1" apply false
              id("org.jetbrains.kotlin.android") version "1.8.10" apply false
          }
          EOF

          cat <<EOF > app/build.gradle.kts
          plugins { id("com.android.application"); id("org.jetbrains.kotlin.android") }
          android {
              namespace = "com.ghost.browser"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.ghost.browser"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              buildFeatures { compose = true }
              composeOptions { kotlinCompilerExtensionVersion = "1.4.3" }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.10.1")
              implementation("androidx.activity:activity-compose:1.7.2")
              implementation(platform("androidx.compose:compose-bom:2023.05.01"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.material:material")
          }
          EOF

          # 5. FORCE GENERATE GRADLE WRAPPER 8.4
          gradle wrapper --gradle-version 8.4

      - name: Build APK with Wrapper
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ghost-browser-apk
          path: app/build/outputs/apk/debug/app-debug.apk
