name: Ghost Browser APK Generator

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Project Structure
        run: |
          mkdir -p app/src/main/java/com/ghost/browser
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/mipmap-mdpi

          # 1. Fix Manifest
          if [ -f AndroidManifest.xml ]; then
            sed -i 's/package="com.ghost.browser"//g' AndroidManifest.xml
            mv AndroidManifest.xml app/src/main/AndroidManifest.xml
          fi

          # 2. Move Kotlin Code
          mv MainActivity.kt app/src/main/java/com/ghost/browser/MainActivity.kt || true

          # 3. Create Resources
          cat <<EOF > app/src/main/res/values/colors.xml
          <?xml version="1.0" encoding="utf-8"?><resources>
          <color name="purple_200">#FFBB86FC</color>
          <color name="purple_500">#FF6200EE</color>
          <color name="teal_200">#FF03DAC5</color>
          </resources>
          EOF
          
          cat <<EOF > app/src/main/res/values/themes.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.MaterialComponents.Light.NoActionBar" parent="Theme.MaterialComponents.Light.NoActionBar">
                  <item name="colorPrimary">@color/purple_500</item>
                  <item name="colorSecondary">@color/teal_200</item>
              </style>
          </resources>
          EOF

          # 4. Create Build Files
          cat <<EOF > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

          cat <<EOF > settings.gradle
          include ':app'
          EOF

          cat <<EOF > build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { 
                  classpath 'com.android.tools.build:gradle:8.1.1'
                  classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.8.10'
              }
          }
          allprojects {
              repositories { google(); mavenCentral() }
          }
          EOF

          cat <<EOF > app/build.gradle
          apply plugin: 'com.android.application'
          apply plugin: 'kotlin-android'
          android {
              namespace 'com.ghost.browser'
              compileSdk 34
              defaultConfig {
                  applicationId "com.ghost.browser"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildFeatures { compose true }
              composeOptions { kotlinCompilerExtensionVersion '1.4.3' }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.10.1'
              implementation 'androidx.activity:activity-compose:1.7.2'
              implementation 'androidx.compose.ui:ui:1.4.3'
              implementation 'androidx.compose.material:material:1.4.3'
              // THIS IS THE MISSING KEY:
              implementation 'com.google.android.material:material:1.9.0'
          }
          EOF

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: 8.4

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ghost-browser-apk
          path: app/build/outputs/apk/debug/app-debug.apk
