name: Ghost Browser APK Generator

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Create Project Structure
        run: |
          mkdir -p app/src/main/java/com/ghost/browser
          mkdir -p app/src/main/res/values
          
          # 1. Clean Manifest (Remove the legacy package attribute)
          if [ -f AndroidManifest.xml ]; then
            sed -i 's/package="com.ghost.browser"//g' AndroidManifest.xml
            mv AndroidManifest.xml app/src/main/AndroidManifest.xml
          fi

          # 2. Move Kotlin Code
          mv MainActivity.kt app/src/main/java/com/ghost/browser/MainActivity.kt || true

          # 3. Create gradle.properties
          cat <<EOF > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          kotlin.code.style=official
          org.gradle.jvmargs=-Xmx2048m
          EOF

          # 4. Create settings.gradle.kts (Fixed Resolution Strategy)
          cat <<EOF > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "GhostBrowser"
          include(":app")
          EOF

          # 5. Create root build.gradle.kts
          cat <<EOF > build.gradle.kts
          plugins {
              id("com.android.application") version "8.2.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
          }
          EOF

          # 6. Create app/build.gradle.kts
          cat <<EOF > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.ghost.browser"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.ghost.browser"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              buildFeatures { compose = true }
              composeOptions { kotlinCompilerExtensionVersion = "1.5.8" }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.7.0")
              implementation("androidx.activity:activity-compose:1.8.2")
              implementation(platform("androidx.compose:compose-bom:2024.02.00"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.material:material")
          }
          EOF

      - name: Build with Gradle Wrapper
        run: |
          # We use 'gradle' which is pre-installed on the runner
          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ghost-browser-apk
          path: app/build/outputs/apk/debug/app-debug.apk
