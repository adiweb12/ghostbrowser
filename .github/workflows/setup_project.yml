name: Ghost Browser APK Generator

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Project Structure
        run: |
          mkdir -p app/src/main/java/com/ghost/browser
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/mipmap-anydpi-v26

          # 1. Move Kotlin files
          mv MainActivity.kt app/src/main/java/com/ghost/browser/ || true
          mv GhostVpnService.kt app/src/main/java/com/ghost/browser/ || true

          # 2. Fix Manifest
          if [ -f AndroidManifest.xml ]; then
            sed -i 's/package="com.ghost.browser"//g' AndroidManifest.xml
            mv AndroidManifest.xml app/src/main/AndroidManifest.xml
          fi

          # 3. Create Modern Resources (Material 3 compatible)
          cat <<EOF > app/src/main/res/values/colors.xml
          <?xml version="1.0" encoding="utf-8"?><resources>
          <color name="purple_80">#D0BCFF</color>
          <color name="black">#FF000000</color>
          <color name="white">#FFFFFFFF</color>
          </resources>
          EOF
          
          cat <<EOF > app/src/main/res/values/themes.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="EdgeToEdge" parent="Theme.Material3.DayNight.NoActionBar">
                  <item name="android:statusBarColor">@android:color/transparent</item>
                  <item name="android:navigationBarColor">@android:color/transparent</item>
              </style>
          </resources>
          EOF

          # 4. Create Icon
          cat <<EOF > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/black"/>
              <foreground><inset android:inset="25%"><shape android:shape="oval"><solid android:color="@color/purple_80"/></shape></inset></foreground>
          </adaptive-icon>
          EOF

          # 5. Build Configuration
          cat <<EOF > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

          cat <<EOF > settings.gradle
          include ':app'
          EOF

          cat <<EOF > build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { 
                  classpath 'com.android.tools.build:gradle:8.2.2'
                  classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22'
              }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF

          cat <<EOF > app/build.gradle
          apply plugin: 'com.android.application'
          apply plugin: 'kotlin-android'
          android {
              namespace 'com.ghost.browser'
              compileSdk 34 // Note: Standard runners support up to 34 stably; use 34 for now to ensure build success
              defaultConfig {
                  applicationId "com.ghost.browser"
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName "1.0-Ghost"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
              buildFeatures { compose true }
              composeOptions { kotlinCompilerExtensionVersion '1.5.8' }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.activity:activity-compose:1.8.2'
              implementation 'androidx.compose.ui:ui:1.6.1'
              implementation 'androidx.compose.material3:material3:1.2.0'
              implementation 'com.google.android.material:material:1.11.0'
          }
          EOF

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: 8.5

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ghost-browser-apk
          path: app/build/outputs/apk/debug/app-debug.apk
