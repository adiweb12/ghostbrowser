name: Ghost Browser APK Generator

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create Full Android Project Structure
        run: |
          # Create folders
          mkdir -p app/src/main/java/com/ghost/browser
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/mipmap-mdpi

          # Move your existing files into the structure
          mv AndroidManifest.xml app/src/main/AndroidManifest.xml || echo "Manifest already in place"
          mv MainActivity.kt app/src/main/java/com/ghost/browser/MainActivity.kt || echo "Main already in place"

          # Create settings.gradle
          echo "include ':app'" > settings.gradle

          # Create root build.gradle
          cat <<EOF > build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.1.1'; classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.8.20" }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF

          # Create app/build.gradle
          cat <<EOF > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'kotlin-android'
          }
          android {
              namespace 'com.ghost.browser'
              compileSdk 34
              defaultConfig {
                  applicationId "com.ghost.browser"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildFeatures { compose true }
              composeOptions { kotlinCompilerExtensionVersion '1.4.5' }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.compose.ui:ui:1.4.3'
              implementation 'androidx.compose.material:material:1.4.3'
              implementation 'androidx.activity:activity-compose:1.7.2'
              implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.1'
          }
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Debug APK
        run: |
          # Use the built-in gradle if wrapper is missing
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ghost-browser-apk
          path: app/build/outputs/apk/debug/app-debug.apk
