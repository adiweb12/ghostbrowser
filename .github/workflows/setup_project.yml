name: Build Ghost Browser

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Allows you to run it manually from your phone

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create Android Structure
        run: |
          # 1. Create the folder hierarchy for a standard project
          mkdir -p app/src/main/java/com/ghost/browser
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/mipmap-mdpi
          
          # 2. Move your Manifest to the correct spot
          # Assumes your file is currently in the root named 'AndroidManifest.xml'
          mv AndroidManifest.xml app/src/main/AndroidManifest.xml
          
          # 3. Move your Kotlin file to the package folder
          # Assumes your file is currently in the root named 'MainActivity.kt'
          mv MainActivity.kt app/src/main/java/com/ghost/browser/MainActivity.kt

      - name: Generate Build Files
        run: |
          # Create a basic build.gradle for the app
          cat <<EOF > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'kotlin-android'
          }
          android {
              namespace 'com.ghost.browser'
              compileSdk 34
              defaultConfig {
                  applicationId "com.ghost.browser"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.compose.ui:ui:1.5.4'
              implementation 'androidx.compose.material:material:1.5.4'
              implementation 'androidx.activity:activity-compose:1.8.1'
          }
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || true

      - name: Build with Gradle
        run: ./gradlew assembleDebug || echo "Gradle wrapper missing, initialization required."
