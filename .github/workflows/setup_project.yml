name: Mobile-Friendly Android Build

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Create Structure and Clean Files
        run: |
          mkdir -p app/src/main/java/com/example/kotlinbrowser
          mkdir -p app/src/main/res/values
          
          # Clean hidden characters and move files
          sed -i 's/\r$//' MainActivity.kt || true
          sed -i 's/\r$//' AndroidManifest.xml || true
          cp MainActivity.kt app/src/main/java/com/example/kotlinbrowser/MainActivity.kt || true
          cp AndroidManifest.xml app/src/main/AndroidManifest.xml || true

      - name: Generate Gradle Properties (The Fix)
        run: |
          # This enables AndroidX and Jetifier which was causing your error
          echo "android.useAndroidX=true" > gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties
          echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" >> gradle.properties

      - name: Generate Stable Gradle Config
        run: |
          cat <<EOF > settings.gradle.kts
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "GhostBrowser"
          include(":app")
          EOF

          cat <<EOF > build.gradle.kts
          plugins {
              id("com.android.application") version "8.2.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.20" apply false
          }
          EOF

          cat <<EOF > app/build.gradle.kts
          plugins { id("com.android.application"); id("org.jetbrains.kotlin.android") }
          android {
              namespace = "com.example.kotlinbrowser"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.example.kotlinbrowser"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              buildFeatures { compose = true }
              composeOptions { kotlinCompilerExtensionVersion = "1.5.4" }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation("androidx.activity:activity-compose:1.8.2")
              implementation(platform("androidx.compose:compose-bom:2023.10.01"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.webkit:webkit:1.11.0")
          }
          EOF

      - name: Manual Gradle Setup
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip -q gradle-8.5-bin.zip
          ./gradle-8.5/bin/gradle wrapper --gradle-version 8.5

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: GhostBrowser-APK
          path: app/build/outputs/apk/debug/app-debug.apk
